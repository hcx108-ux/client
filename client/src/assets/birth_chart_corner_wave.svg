<svg width="178" height="195" viewBox="0 0 178 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Organic Sand / Chalk Brush Texture Filter -->
    <filter id="sandBrushChalk" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.16" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="0.35" result="softChalk" />
      <feMerge>
        <feMergeNode in="softChalk" />
        <feMergeNode in="SourceGraphic" opacity="0.85" />
      </feMerge>
    </filter>

    <linearGradient id="chalkGrad1" x1="0" y1="195" x2="178" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#FFF8EA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F7E6C4" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="chalkGrad2" x1="0" y1="195" x2="160" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFF9EE" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#F2DEC0" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <g filter="url(#sandBrushChalk)" opacity="0.7">
    <!-- Outer wave 1 -->
    <path 
      d="M -10 115 C 25 110 75 75 115 40 C 142 15 165 -2 178 -10" 
      stroke="url(#chalkGrad1)" 
      stroke-width="16" 
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none" 
    />
    <path 
      d="M -8 114 C 27 109 77 74 117 39 C 144 14 167 -3 178 -10" 
      stroke="#FFFFFF" 
      stroke-width="6" 
      stroke-linecap="round"
      opacity="0.85"
      fill="none" 
    />

    <!-- Wave 2 -->
    <path 
      d="M -10 145 C 30 138 82 110 124 70 C 150 42 170 18 178 5" 
      stroke="url(#chalkGrad2)" 
      stroke-width="16" 
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none" 
    />
    <path 
      d="M -8 144 C 32 137 84 109 126 69 C 152 41 172 17 178 5" 
      stroke="#FFFFFF" 
      stroke-width="7" 
      stroke-linecap="round"
      opacity="0.8"
      fill="none" 
    />

    <!-- Wave 3 -->
    <path 
      d="M -10 175 C 35 165 88 138 130 102 C 155 76 172 50 178 35" 
      stroke="url(#chalkGrad1)" 
      stroke-width="15" 
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none" 
    />
    <path 
      d="M -8 174 C 37 164 90 137 132 101 C 157 75 174 49 178 35" 
      stroke="#FFFFFF" 
      stroke-width="6" 
      stroke-linecap="round"
      opacity="0.8"
      fill="none" 
    />

    <!-- Wave 4 -->
    <path 
      d="M -5 200 C 40 190 92 165 135 134 C 158 112 173 90 178 72" 
      stroke="url(#chalkGrad2)" 
      stroke-width="14" 
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none" 
    />
    <path 
      d="M -3 199 C 42 189 94 164 137 133 C 160 111 175 89 178 72" 
      stroke="#FFFFFF" 
      stroke-width="5" 
      stroke-linecap="round"
      opacity="0.75"
      fill="none" 
    />

    <!-- Wave 5 -->
    <path 
      d="M 15 208 C 50 200 98 184 140 158 C 162 142 175 125 178 110" 
      stroke="url(#chalkGrad1)" 
      stroke-width="12" 
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none" 
    />
    <path 
      d="M 17 207 C 52 199 100 183 142 157 C 164 141 177 124 178 110" 
      stroke="#FFFFFF" 
      stroke-width="4" 
      stroke-linecap="round"
      opacity="0.7"
      fill="none" 
    />
  </g>
</svg>